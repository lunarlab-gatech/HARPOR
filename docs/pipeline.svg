<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">HARPOR pipeline</title>
  <desc id="desc">A phone video, a ROS 1 or 2 bag or a Stray Scanner zip becomes a posed, textured mesh through SAM 3 masks, Depth Anything 3 cameras and depth, an optional LiDAR metric scale, view selection with an optional pause for review, MV-SAM3D and a pose fit (A). VoMP v1.1 estimates the materials on the canonical mesh right after MV-SAM3D (B). An optional agent in Blender refines the geometry and appearance; a host check compares the surface with the original, settles the candidate in MuJoCo with the VoMP materials and asks a VLM to judge the frames, and a failed check starts a repair round, with at most 3 builds; the best candidate is delivered (C). The export turns the mesh upright, transfers the VoMP materials, recomputes mass and inertia, and writes MJCF, USD, URDF, an optional 360 video and results.zip (D).</desc>
  <defs>
    <style>
      text { font-family: Helvetica, Arial, "Liberation Sans", sans-serif; fill: #1f2d5a; }
      .t1 { font-size: 26px; font-weight: 700; }
      .t2 { font-size: 20px; font-weight: 700; }
      .bt { font-size: 17px; font-weight: 700; }
      .bs { font-size: 14px; fill: #4a5568; }
      .xs { font-size: 13px; fill: #4a5568; }
      .tag { font-size: 14px; fill: #6b5a8a; font-style: italic; }
      .ch { font-size: 14px; }
      .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; }
      .lt { font-size: 14px; fill: #4a5568; }
      .badge { font-size: 19px; font-weight: 700; fill: #ffffff; }
      .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .halo { paint-order: stroke; stroke-width: 6px; stroke-linejoin: round; }
      .c { text-anchor: middle; }
      .box { fill: #ffffff; stroke-width: 1.6; }
      .flow { fill: none; stroke: #4a5568; stroke-width: 2; }
      .mat { fill: none; stroke: #d9822b; stroke-width: 2.4; }
      .dash { stroke-dasharray: 7 5; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9822b"/>
    </marker>
    <g id="pause">
      <rect x="0" y="0" width="22" height="22" rx="11" fill="#fff3d4" stroke="#e0a526" stroke-width="1.4"/>
      <rect x="7.5" y="6" width="2.6" height="10" fill="#b7791f"/>
      <rect x="12" y="6" width="2.6" height="10" fill="#b7791f"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <!-- ===================== A: Reconstruction ===================== -->
  <rect x="16" y="16" width="1168" height="334" rx="14" fill="#f4f8fc" stroke="#b9d3ea" stroke-width="1.6"/>
  <circle cx="44" cy="44" r="17" fill="#2b7bbf"/>
  <text class="badge c" x="44" y="51">A</text>
  <text class="t1" x="70" y="53">Reconstruction</text>

  <rect x="36" y="92" width="170" height="28" rx="14" class="box" stroke="#7fb0da"/>
  <text class="ch c" x="121" y="111">Phone video</text>
  <rect x="36" y="124" width="170" height="28" rx="14" class="box" stroke="#7fb0da"/>
  <text class="ch c" x="121" y="143">ROS 1 or 2 bag</text>
  <rect x="36" y="156" width="170" height="28" rx="14" class="box" stroke="#7fb0da"/>
  <text class="ch c" x="121" y="175">Stray Scanner zip</text>
  <path class="flow" d="M206,106 H220 M206,138 H220 M206,170 H220 M220,106 V170"/>
  <path class="flow" d="M220,138 H239" marker-end="url(#ah)"/>

  <rect x="240" y="88" width="180" height="100" rx="8" class="box" stroke="#5b9bd1"/>
  <text class="bt c" x="330" y="128">SAM 3 masks</text>
  <text class="bs c" x="330" y="150">finds the object</text>
  <text class="bs c" x="330" y="168">from its name</text>
  <path class="flow" d="M420,138 H455" marker-end="url(#ah)"/>

  <rect x="456" y="88" width="190" height="100" rx="8" class="box" stroke="#5b9bd1"/>
  <text class="bt c" x="551" y="128">Depth Anything 3</text>
  <text class="bs c" x="551" y="150">cameras and depth</text>
  <text class="bs c" x="551" y="168">for every frame</text>
  <path class="flow" d="M646,138 H681" marker-end="url(#ah)"/>

  <rect x="682" y="88" width="180" height="100" rx="8" class="box" stroke="#5b9bd1"/>
  <text class="bt c" x="772" y="128">View selection</text>
  <text class="bs c" x="772" y="150">2 to 12 views</text>
  <text class="bs c" x="772" y="168">(6 by default)</text>
  <use href="#pause" xlink:href="#pause" x="851" y="77"/>
  <path class="flow" d="M862,138 H897" marker-end="url(#ah)"/>

  <rect x="898" y="88" width="266" height="100" rx="8" class="box" stroke="#5fa94d"/>
  <text class="t2 c" x="1031" y="128">MV-SAM3D</text>
  <text class="bs c" x="1031" y="150">multi-view SAM 3D Objects</text>
  <text class="bs c" x="1031" y="168">gives a textured mesh</text>

  <rect x="456" y="236" width="190" height="90" rx="8" class="box dash" stroke="#5b9bd1"/>
  <text class="bt c" x="551" y="262">LiDAR</text>
  <text class="bs c" x="551" y="284">sets the metric scale</text>
  <text class="xs c" x="551" y="306">bag LiDAR or iPhone depth</text>
  <path class="flow dash" d="M646,281 H772 V189" marker-end="url(#ah)"/>

  <path class="flow" d="M1031,188 V235" marker-end="url(#ah)"/>
  <rect x="898" y="236" width="266" height="90" rx="8" class="box" stroke="#5fa94d"/>
  <text class="bt c" x="1031" y="262">Pose fit</text>
  <text class="bs c" x="1031" y="284">fits pose and scale</text>
  <text class="mono c" x="1031" y="308">posed.glb</text>

  <!-- ===================== B: Materials ===================== -->
  <rect x="1204" y="16" width="380" height="334" rx="14" fill="#fdf4e8" stroke="#efc591" stroke-width="1.6"/>
  <circle cx="1232" cy="44" r="17" fill="#d9822b"/>
  <text class="badge c" x="1232" y="51">B</text>
  <text class="t1" x="1258" y="53">Materials</text>

  <path class="flow" d="M1164,138 H1223" marker-end="url(#ah)"/>
  <rect x="1224" y="88" width="340" height="120" rx="8" class="box" stroke="#e39b4f"/>
  <text class="bt c" x="1394" y="116">VoMP v1.1</text>
  <text class="bs c" x="1394" y="138">materials on the canonical mesh,</text>
  <text class="bs c" x="1394" y="157">right after MV-SAM3D</text>
  <text class="xs c" x="1394" y="181">density, Young's modulus and</text>
  <text class="xs c" x="1394" y="198">Poisson's ratio per voxel</text>

  <path class="flow" d="M1394,208 V253" marker-end="url(#ah)"/>
  <rect x="1284" y="254" width="220" height="30" rx="15" fill="#ffecd6" stroke="#e9a95c" stroke-width="1.6"/>
  <text class="ch c" x="1394" y="274">VoMP materials</text>

  <!-- ===================== C: Agent refinement ===================== -->
  <rect x="16" y="410" width="1060" height="440" rx="14" fill="#f6f1fc" stroke="#cbb5e8" stroke-width="1.6"/>
  <circle cx="44" cy="438" r="17" fill="#7b4fc2"/>
  <text class="badge c" x="44" y="445">C</text>
  <text class="t1" x="70" y="447">Agent refinement</text>
  <text class="tag" x="1056" y="446" text-anchor="end">optional</text>

  <rect x="36" y="470" width="340" height="140" rx="10" fill="#fbf8ff" stroke="#8a63c9" stroke-width="2.2"/>
  <circle cx="114" cy="492" r="10" fill="#7b4fc2"/>
  <text class="num c" x="114" y="497">1</text>
  <text class="bt" x="132" y="498">Agent in Blender</text>
  <text class="bs c" x="206" y="524">GPT-6-Astra, Claude Opus 5.5</text>
  <text class="bs c" x="206" y="543">or Claude Fable 5.2</text>
  <text class="bs c" x="206" y="570">refines geometry and appearance</text>
  <text class="xs c" x="206" y="592">first build: 600 s</text>
  <path class="flow" d="M376,540 H419" marker-end="url(#ah)"/>

  <rect x="420" y="470" width="300" height="200" rx="8" class="box" stroke="#9b7bd4"/>
  <circle cx="512" cy="492" r="10" fill="#7b4fc2"/>
  <text class="num c" x="512" y="497">2</text>
  <text class="bt" x="530" y="498">Host check</text>
  <text class="xs c" x="570" y="518">after each build or repair</text>
  <rect x="438" y="532" width="12" height="12" rx="2" fill="#7b4fc2"/>
  <text class="lt" x="458" y="543">surface vs. the original</text>
  <text class="xs" x="458" y="560">a report, not a test</text>
  <rect x="438" y="576" width="12" height="12" rx="2" fill="#2f9e88"/>
  <text class="lt" x="458" y="587">settle in MuJoCo</text>
  <text class="xs" x="458" y="604">with the VoMP materials</text>
  <rect x="438" y="620" width="12" height="12" rx="2" fill="#b8b2c4"/>
  <text class="lt" x="458" y="631">VLM judges the frames</text>
  <text class="xs" x="458" y="648">against the photo</text>

  <path class="flow" d="M500,670 V750 H377" marker-end="url(#ah)"/>
  <text class="bs halo" x="512" y="716" stroke="#f6f1fc">fail</text>
  <rect x="36" y="690" width="340" height="120" rx="8" class="box dash" stroke="#9b7bd4"/>
  <circle cx="134" cy="712" r="10" fill="#7b4fc2"/>
  <text class="num c" x="134" y="717">3</text>
  <text class="bt" x="152" y="718">Repair round</text>
  <text class="bs c" x="206" y="744">a new agent gets the findings</text>
  <text class="bs c" x="206" y="764">at most 3 builds</text>
  <text class="bs c" x="206" y="784">and 1 planning round</text>
  <path class="flow" d="M206,690 V611" marker-end="url(#ah)"/>
  <text class="xs halo" x="216" y="655" stroke="#f6f1fc">next round</text>

  <path class="flow" d="M720,540 H789" marker-end="url(#ah)"/>
  <text class="xs c halo" x="755" y="564" stroke="#f6f1fc">pass, or</text>
  <text class="xs c halo" x="755" y="580" stroke="#f6f1fc">last round</text>
  <rect x="790" y="470" width="266" height="140" rx="8" class="box" stroke="#9b7bd4"/>
  <circle cx="852" cy="492" r="10" fill="#7b4fc2"/>
  <text class="num c" x="852" y="497">4</text>
  <text class="bt" x="870" y="498">Best candidate</text>
  <text class="bs c" x="923" y="524">the best stored candidate</text>
  <text class="bs c" x="923" y="543">is delivered as a GLB</text>
  <text class="xs c" x="923" y="574">without the agent,</text>
  <text class="xs c" x="923" y="591">posed.glb goes on to D</text>

  <!-- ===================== D: Simulation export ===================== -->
  <rect x="1096" y="410" width="488" height="440" rx="14" fill="#eef7f5" stroke="#9ccfc2" stroke-width="1.6"/>
  <circle cx="1124" cy="438" r="17" fill="#2f9e88"/>
  <text class="badge c" x="1124" y="445">D</text>
  <text class="t1" x="1150" y="447">Simulation export</text>

  <rect x="1116" y="470" width="344" height="90" rx="8" class="box" stroke="#4fae98"/>
  <text class="bt c" x="1288" y="496">Align upright</text>
  <text class="bs c" x="1288" y="518">the agent's GLB, else posed.glb,</text>
  <text class="bs c" x="1288" y="537">turned upright on its support</text>
  <path class="flow" d="M1288,560 V579" marker-end="url(#ah)"/>

  <rect x="1116" y="580" width="344" height="70" rx="8" class="box" stroke="#4fae98"/>
  <text class="bt c" x="1288" y="606">Transfer materials</text>
  <text class="bs c" x="1288" y="628">recompute mass and inertia</text>

  <path class="flow" d="M1288,650 V662 M1186,662 H1494"/>
  <path class="flow" d="M1186,662 V675" marker-end="url(#ah)"/>
  <path class="flow" d="M1340,662 V675" marker-end="url(#ah)"/>
  <path class="flow" d="M1494,662 V675" marker-end="url(#ah)"/>

  <rect x="1116" y="676" width="140" height="68" rx="8" class="box" stroke="#4fae98"/>
  <text class="bt c" x="1186" y="702">MJCF</text>
  <text class="xs c" x="1186" y="722">CoACD hulls</text>
  <rect x="1270" y="676" width="140" height="68" rx="8" class="box" stroke="#4fae98"/>
  <text class="bt c" x="1340" y="702">USD</text>
  <text class="xs c" x="1340" y="722">for Isaac Sim</text>
  <rect x="1424" y="676" width="140" height="68" rx="8" class="box" stroke="#4fae98"/>
  <text class="bt c" x="1494" y="702">URDF</text>
  <text class="xs c" x="1494" y="722">MJCF meshes</text>
  <text class="xs c" x="1300" y="765">one rigid body each; friction 0.6 in MJCF and USD</text>

  <rect x="1116" y="782" width="196" height="52" rx="8" class="box dash" stroke="#4fae98"/>
  <text class="bt c" x="1214" y="804">360° video</text>
  <text class="xs c" x="1214" y="823">optional, Blender</text>
  <path class="flow" d="M1312,808 H1339" marker-end="url(#ah)"/>
  <path class="flow" d="M1530,744 V781" marker-end="url(#ah)"/>
  <rect x="1340" y="782" width="224" height="52" rx="8" fill="#ffffff" stroke="#2f9e88" stroke-width="2"/>
  <text class="mono c" x="1452" y="804" font-weight="700">results.zip</text>
  <text class="xs c" x="1452" y="823">GLBs, MJCF, USD, URDF</text>

  <!-- links between the groups, drawn over the group panels -->
  <path class="flow" d="M1031,326 V374 H330 V469" marker-end="url(#ah)"/>
  <path class="mat" d="M1340,284 V392 H570 V468" marker-end="url(#am)"/>
  <path class="mat" d="M1504,269 H1544 V615 H1462" marker-end="url(#am)"/>
  <path class="flow" d="M1056,515 H1115" marker-end="url(#ah)"/>

  <!-- ===================== legend ===================== -->
  <path class="flow" d="M300,875 H340" marker-end="url(#ah)"/>
  <text class="lt" x="350" y="880">data flow</text>
  <path class="mat" d="M450,875 H490" marker-end="url(#am)"/>
  <text class="lt" x="500" y="880">VoMP materials</text>
  <rect x="640" y="865" width="34" height="20" rx="4" fill="#ffffff" stroke="#4a5568" stroke-width="1.6" class="dash"/>
  <text class="lt" x="684" y="880">optional</text>
  <use href="#pause" xlink:href="#pause" x="780" y="864"/>
  <text class="lt" x="810" y="880">the job can pause here for your review</text>
  <text class="mono" x="1100" y="880">posed.glb</text>
  <text class="lt" x="1190" y="880">a file</text>
</svg>
