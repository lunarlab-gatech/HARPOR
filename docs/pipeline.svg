<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1648 416" width="1648" height="416" role="img" aria-labelledby="title desc">
  <title id="title">HARPOR pipeline</title>
  <desc id="desc">A capture and an object name become a posed, textured mesh through SAM 3, Depth Anything 3, view selection, MV-SAM3D and a pose fit. LiDAR or depth, when the capture has it, sets the metric scale (A), and its returns go to the agent (the fitting returns) and to the host check (the reserved returns) (C). VoMP estimates the materials from the MV-SAM3D mesh (B). An optional VLM agent refines the mesh in Blender, and a failed host check starts a repair round, with at most 3 builds (C). The mass, the inertia and the friction are estimated, and the export writes MJCF, USD and URDF files (D).</desc>
  <defs>
    <style>
      text { font-family: Helvetica, Arial, "Liberation Sans", sans-serif; fill: #1f2937; }
      .pt { font-size: 17px; font-weight: 700; }
      .note { font-size: 14px; font-weight: 400; font-style: italic; fill: #5b6472; }
      .bt { font-size: 16px; font-weight: 700; }
      .bs { font-size: 13px; fill: #5b6472; }
      .lab { font-size: 13px; fill: #5b6472; }
      .badge { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .m { font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 15px; }
      .c { text-anchor: middle; }
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .box { fill: #ffffff; stroke-width: 1.6; }
      .flow { fill: none; stroke: #4b5563; stroke-width: 1.8; }
      .dash { stroke-dasharray: 6 4; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1648" height="416" fill="#ffffff"/>

  <!-- stage panels -->
  <rect x="180" y="16" width="738" height="200" rx="10" fill="#eef4fb" stroke="#c9dcf1" stroke-width="1.4"/>
  <circle cx="204" cy="38" r="11" fill="#2c5d9e"/>
  <text class="badge c" x="204" y="43">A</text>
  <text class="pt" x="222" y="44" fill="#2c5d9e">Reconstruction</text>
  <rect x="942" y="276" width="304" height="124" rx="10" fill="#fdf3e7" stroke="#f0d2ad" stroke-width="1.4"/>
  <circle cx="966" cy="298" r="11" fill="#b5651d"/>
  <text class="badge c" x="966" y="303">B</text>
  <text class="pt" x="984" y="304" fill="#b5651d">Materials</text>
  <rect class="dash" x="942" y="16" width="304" height="200" rx="10" fill="#f4f0fb" stroke="#c8b8e6" stroke-width="1.4"/>
  <circle cx="966" cy="38" r="11" fill="#6a4aa8"/>
  <text class="badge c" x="966" y="43">C</text>
  <text class="pt" x="984" y="44" fill="#6a4aa8">Agent refinement<tspan class="note" dx="6">(optional)</tspan></text>
  <rect x="1270" y="16" width="358" height="200" rx="10" fill="#ecf6f3" stroke="#b9ded4" stroke-width="1.4"/>
  <circle cx="1294" cy="38" r="11" fill="#2e7d6b"/>
  <text class="badge c" x="1294" y="43">D</text>
  <text class="pt" x="1312" y="44" fill="#2e7d6b">Mass, friction and export</text>

  <!-- inputs: capture frames, object name, LiDAR or depth -->
  <rect x="59" y="70" width="70" height="50" rx="4" fill="#e5e7eb" stroke="#9aa3af" stroke-width="1.4"/>
  <rect x="53" y="76" width="70" height="50" rx="4" fill="#f3f4f6" stroke="#9aa3af" stroke-width="1.4"/>
  <rect x="47" y="82" width="70" height="50" rx="4" fill="#ffffff" stroke="#9aa3af" stroke-width="1.4"/>
  <path d="M53,125 L71,102 L83,115 L93,107 L111,125 Z" fill="#cfd5dd"/>
  <circle cx="99" cy="95" r="5" fill="#cfd5dd"/>
  <text class="bt c" x="88" y="153">Capture</text>
  <text class="bs c" x="88" y="170">video, bag or Stray</text>
  <rect x="32" y="183" width="112" height="26" rx="13" fill="#f5f6f8" stroke="#9aa3af" stroke-width="1.4"/>
  <text class="bs c" x="88" y="201" font-style="italic" fill="#1f2937">“object name”</text>
  <rect class="dash" x="28" y="237" width="120" height="30" rx="15" fill="#f5f6f8" stroke="#9aa3af" stroke-width="1.4"/>
  <text class="bs c" x="88" y="257" fill="#1f2937">LiDAR or depth</text>

  <!-- A: reconstruction -->
  <rect class="box" x="194" y="62" width="100" height="78" rx="6" stroke="#5b8fd0"/>
  <text class="bt c" x="244" y="97">SAM 3</text>
  <text class="bs c" x="244" y="118">object masks</text>
  <rect class="box" x="322" y="62" width="156" height="78" rx="6" stroke="#5b8fd0"/>
  <text class="bt c" x="400" y="97">Depth Anything 3</text>
  <text class="bs c" x="400" y="118">cameras, depth</text>
  <rect class="box" x="506" y="62" width="134" height="78" rx="6" stroke="#5b8fd0"/>
  <text class="bt c" x="573" y="97">View selection</text>
  <text class="bs c" x="573" y="118">2 to 12 views</text>
  <rect class="box" x="668" y="62" width="112" height="78" rx="6" stroke="#5b8fd0"/>
  <text class="bt c" x="724" y="97">MV-SAM3D</text>
  <text class="bs c" x="724" y="118">textured mesh</text>
  <rect class="box" x="808" y="62" width="96" height="78" rx="6" stroke="#5b8fd0"/>
  <text class="bt c" x="856" y="97">Pose fit</text>
  <text class="bs c" x="856" y="118">pose, scale</text>

  <!-- B: materials -->
  <rect class="box" x="1010" y="314" width="168" height="78" rx="6" stroke="#e09a4f"/>
  <text class="bt c" x="1094" y="349">VoMP</text>
  <text class="bs c" x="1094" y="370"><tspan class="m">ρ</tspan>, <tspan class="m">E</tspan>, <tspan class="m">ν</tspan> per voxel</text>

  <!-- C: agent refinement -->
  <rect class="box" x="956" y="62" width="136" height="78" rx="6" stroke="#9175c9"/>
  <text class="bt c" x="1024" y="97">VLM agent</text>
  <text class="bs c" x="1024" y="118">refines in Blender</text>
  <rect class="box" x="1120" y="62" width="112" height="78" rx="6" stroke="#9175c9"/>
  <text class="bt c" x="1176" y="97">Host check</text>
  <text class="bs c" x="1176" y="118">vs. original</text>

  <!-- D: mass, friction and export -->
  <rect class="box" x="1284" y="62" width="176" height="78" rx="6" stroke="#4fa892"/>
  <text class="bt c" x="1372" y="89">Physical properties</text>
  <text class="bs c" x="1372" y="110">mass, inertia (VoMP)</text>
  <text class="bs c" x="1372" y="127">friction (VLM, photos)</text>
  <path d="M1556,65 L1582,80 L1556,95 L1530,80 Z" fill="#d7efe8" stroke="#2e7d6b" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M1530,80 L1556,95 L1556,125 L1530,110 Z" fill="#a9dacb" stroke="#2e7d6b" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M1556,95 L1582,80 L1582,110 L1556,125 Z" fill="#7cc4b0" stroke="#2e7d6b" stroke-width="1.4" stroke-linejoin="round"/>
  <text class="bt c" x="1556" y="153">Sim-ready model</text>
  <text class="bs c" x="1556" y="170">MJCF, USD, URDF</text>

  <!-- data flow -->
  <path class="flow" d="M132,101 H193" marker-end="url(#ah)"/>
  <path class="flow" d="M144,196 H244 V141" marker-end="url(#ah)"/>
  <path class="flow" d="M294,101 H321" marker-end="url(#ah)"/>
  <path class="flow" d="M478,101 H505" marker-end="url(#ah)"/>
  <path class="flow" d="M640,101 H667" marker-end="url(#ah)"/>
  <path class="flow" d="M780,101 H807" marker-end="url(#ah)"/>
  <path class="flow" d="M904,101 H955" marker-end="url(#ah)"/>
  <path class="flow" d="M1092,101 H1119" marker-end="url(#ah)"/>
  <path class="flow" d="M1232,101 H1283" marker-end="url(#ah)"/>
  <path class="flow" d="M1460,101 H1522" marker-end="url(#ah)"/>
  <path class="flow" d="M1176,140 V168 H1024 V141" marker-end="url(#ah)"/>
  <text class="lab halo" x="1100" y="187" text-anchor="middle">repair, at most 3 builds</text>
  <path class="flow dash" d="M148,252 H1210 V141" marker-end="url(#ah)"/>
  <path class="flow dash" d="M573,252 V141" marker-end="url(#ah)"/>
  <circle cx="573" cy="252" r="3" fill="#4b5563"/>
  <path class="flow dash" d="M980,252 V141" marker-end="url(#ah)"/>
  <circle cx="980" cy="252" r="3" fill="#4b5563"/>
  <text class="lab halo" x="582" y="240" text-anchor="start">metric scale</text>
  <text class="lab halo" x="989" y="240" text-anchor="start">fitting returns</text>
  <text class="lab halo" x="1219" y="240" text-anchor="start">reserved returns</text>
  <path d="M724,244 V260" stroke="#ffffff" stroke-width="8"/>
  <path class="flow" d="M724,140 V353 H1009" marker-end="url(#ah)"/>
  <path class="flow" d="M1178,353 H1372 V141" marker-end="url(#ah)"/>
  <text class="lab halo" x="1381" y="240" text-anchor="start">materials</text>

  <!-- legend -->
  <path class="flow dash" d="M20,398 H54"/>
  <text class="lab" x="62" y="403">optional</text>
</svg>
