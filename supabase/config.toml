# The Supabase CLI's local stack only (`supabase start`, `supabase db reset`, `supabase test db`).
# Never run `supabase config push` with this file: it turns on email sign-in for local tests, which
# the cloud project keeps off. The cloud project's settings are made in its dashboard.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "harpor"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the cloud project's Postgres version (Settings, Infrastructure) before `supabase db pull`.
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
# The Free plan's limit; the buckets set their own limits in the storage migration.
file_size_limit = "50MiB"

[auth]
enabled = true
# The site served from the repo for local tests (python -m http.server 8766 in site/).
site_url = "http://localhost:8766/"
# The local site, and the loopback page of `python -m gator.webapp.worker login`.
additional_redirect_urls = ["http://localhost:8766/", "http://127.0.0.1:8767/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
# Only for local tests: the seed's accounts sign in with a password that the test sets.
enable_signup = true
enable_confirmations = false

[auth.sms]
enable_signup = false

# Google and GitHub need real OAuth apps, which the local stack does not have. The cloud project
# sets them in its dashboard.
[auth.external.github]
enabled = false

[auth.external.google]
enabled = false
