[project]
name = "gator"
version = "0.0.1"
description = "HARPOR: a phone video, rosbag or Stray Scanner capture of one object to simulation-ready models."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "scipy", "trimesh"]

[tool.setuptools.packages.find]
include = ["gator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
