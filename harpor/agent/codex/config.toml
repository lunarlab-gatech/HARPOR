# Codex CLI 0.171.0 settings for the agent (README.md note 5), read from CODEX_HOME=/session/codex_home.
# The agent runs GPT-6.2-Astra. The paper ran GPT-6-Astra through the Codex CLI at extra-high reasoning effort, and
# the agent keeps that effort. Every key passes --strict-config with 0.171.0 (checked on ICE on 2026-11-20). The
# defaults in the comments come from codex-rs at tag rust-v0.162.1 (config/src/config_toml.rs and others).
model = "gpt-6.2-astra"
model_reasoning_effort = "xhigh"
approval_policy = "never"
sandbox_mode = "danger-full-access"
# The default is "cached", and it becomes "live" without a sandbox. The agent gets no web search.
web_search = "disabled"

[shell_environment_policy]
# The default (true) passes variables such as CODEX_API_KEY to the agent's shell commands.
ignore_default_excludes = false

[analytics]
enabled = false

[feedback]
enabled = false
